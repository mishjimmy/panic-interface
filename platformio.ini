; LILYGO T-RSS3 (ESP32-S3, 8 MB flash, no PSRAM)
; Contact-closure -> RS232 / RS485 status sender

[platformio]
default_envs = t-rss3

[env:t-rss3]
platform  = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17
board     = esp32-s3-devkitc-1         ; 8 MB QIO flash, no PSRAM - matches T-RSS3
framework = arduino

board_build.flash_size = 8MB
board_upload.flash_size = 8MB

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1        ; Serial = native USB CDC (debug console)
    -DARDUINO_USB_MODE=1               ; HW CDC/JTAG USB mode
    -DCORE_DEBUG_LEVEL=0               ; keep core log noise off the UARTs

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

monitor_speed = 115200
upload_speed  = 115200
; esptool 4.5.1's flasher stub loses the ESP32-S3 native USB link on this board
; ("No serial data received"), so flash through the ROM loader instead.
upload_flags  = --no-stub
